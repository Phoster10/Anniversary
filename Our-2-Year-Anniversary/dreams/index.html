<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Dreams — Phoster & Tracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fbe4ea; --rose:#e089a8; --rose-deep:#c4577a; --gold:#f0c96b;
    --ink:#f5eef2; --ink-soft:#c9b8c6; --shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Karla', sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse 1000px 700px at 50% 20%, #2a1b33 0%, #140d1a 55%, #0a0710 100%);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute; background:#fff; border-radius:50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:0.2; } 50%{ opacity:1; } }

  nav{
    background: rgba(20,13,26,0.85);
    backdrop-filter: blur(6px);
    padding: 18px 0;
    position: sticky; top:0; z-index:50;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .navwrap{ max-width:1180px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600; font-size:19px; color: var(--gold); text-decoration:none; line-height:1.1; }
  .logo .sub{ display:block; font-family:'Karla', sans-serif; font-style:normal; font-size:9.5px; letter-spacing:2px; color: var(--ink-soft); }
  .navlinks{ display:flex; align-items:center; gap:6px; }
  .navlinks a{ text-decoration:none; color: var(--ink-soft); font-size:14.5px; font-weight:500; padding:9px 16px; border-radius:100px; }
  .navlinks a:hover{ background: rgba(255,255,255,0.08); color:#fff; }
  .navlinks a.active{ background: rgba(255,255,255,0.12); color: var(--gold); }
  .heart-icon{ width:36px; height:36px; border-radius:50%; background: var(--rose-deep); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; font-size:15px; flex-shrink:0; }

  .wrap{ position:relative; z-index:1; max-width: 900px; margin:0 auto; padding: 0 20px; }

  .page-header{ text-align:center; padding: 46px 0 6px; }
  .eyebrow{ font-family:'Cormorant Garamond', serif; font-style:italic; color: var(--gold); font-size:15px; margin:0 0 6px; }
  h1{ font-family:'Playfair Display', serif; font-style:italic; font-weight:500; font-size: clamp(28px, 4.5vw, 42px); color:#fff; margin:0 0 8px; }
  .page-sub{ color: var(--ink-soft); font-size:14.5px; }

  .progress-wrap{
    text-align:center; margin: 18px 0 10px;
  }
  .progress-label{ font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-soft); margin-bottom:6px; }
  .progress-num{ font-family:'Playfair Display', serif; font-size:22px; color: var(--gold); font-weight:600; transition: transform .3s ease; }
  .progress-num.bump{ transform: scale(1.3); }

  .prompt{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
    color: var(--ink-soft);
    min-height: 26px;
    margin: 4px 0 6px;
  }

  /* ATOM STAGE */
  .atom-stage{
    position:relative;
    width: min(90vw, 520px);
    height: min(90vw, 520px);
    margin: 10px auto 20px;
  }
  .orbit{
    position:absolute;
    top:50%; left:50%;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius:50%;
    transform: translate(-50%,-50%);
  }
  .nucleus{
    position:absolute;
    top:50%; left:50%;
    width: 64px; height:64px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 35%, var(--rose-deep) 100%);
    box-shadow: 0 0 40px 10px rgba(240,201,107,0.5), 0 0 80px 30px rgba(196,87,122,0.3);
    z-index:5;
    transition: box-shadow .4s ease, transform .4s ease;
  }
  .nucleus.pulse{
    animation: nucleusPulse .6s ease;
  }
  @keyframes nucleusPulse{
    0%{ transform: translate(-50%,-50%) scale(1); }
    40%{ transform: translate(-50%,-50%) scale(1.35); box-shadow: 0 0 70px 20px rgba(240,201,107,0.8), 0 0 120px 50px rgba(196,87,122,0.5); }
    100%{ transform: translate(-50%,-50%) scale(1); }
  }

  .electron{
    position:absolute;
    top:0; left:0;
    width: 40px; height:40px;
    margin: -20px 0 0 -20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #fff, var(--rose) 40%, var(--rose-deep) 100%);
    box-shadow: 0 0 16px 4px rgba(224,137,168,0.55);
    z-index:6;
    user-select:none;
    transition: opacity .35s ease;
  }
  .electron.golden{
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 40%, #b8860b 100%);
    box-shadow: 0 0 22px 6px rgba(240,201,107,0.7);
  }
  .electron.caught{
    pointer-events:none;
    animation: flyToNucleus .5s ease forwards;
  }
  @keyframes flyToNucleus{
    to{ transform: translate(calc(-1 * var(--dx)), calc(-1 * var(--dy))) scale(0.2); opacity:0; }
  }

  .particle-burst{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--gold);
    pointer-events:none;
    z-index:7;
    animation: burstOut .6s ease-out forwards;
  }
  @keyframes burstOut{
    to{ transform: translate(var(--bx), var(--by)) scale(0); opacity:0; }
  }

  /* DREAM CARD MODAL */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(10,7,16,0.82);
    display:none; align-items:center; justify-content:center; z-index:200; padding:24px;
  }
  .modal-overlay.visible{ display:flex; }
  .dream-card{
    background: linear-gradient(160deg, #2a1b33, #1a1120);
    border: 1px solid rgba(240,201,107,0.3);
    border-radius: 26px;
    padding: 40px 32px;
    max-width: 440px;
    width:100%;
    text-align:center;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 50px rgba(240,201,107,0.15);
    animation: cardPop .45s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes cardPop{ from{ opacity:0; transform: scale(0.8); } to{ opacity:1; transform: scale(1); } }
  .dream-unlocked-label{
    font-size:12px; letter-spacing:2px; text-transform:uppercase; color: var(--gold); margin-bottom:16px;
  }
  .dream-emoji{ font-size:44px; margin-bottom:14px; }
  .dream-title{
    font-family:'Playfair Display', serif; font-weight:600; font-size:19px; color:#fff;
    margin: 0 0 16px; letter-spacing:0.5px;
  }
  .dream-quote{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:16.5px; color: var(--ink-soft);
    line-height:1.6; margin: 0 0 20px;
  }
  .dream-progress{ font-size:13px; color: var(--ink-soft); margin-bottom:22px; }
  .continue-btn{
    background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff; border:none;
    font-weight:700; font-size:13.5px; padding: 13px 28px; border-radius:100px; cursor:pointer;
    letter-spacing:0.5px;
  }
  .dream-card.golden .continue-btn{ background: linear-gradient(135deg, var(--gold), #b8860b); color:#1a1120; }
  .dream-card.golden{ border-color: rgba(240,201,107,0.6); }

  .mystery-banner{
    text-align:center; font-family:'Cormorant Garamond', serif; font-style:italic;
    color: var(--gold); font-size:18px; margin: 20px 0; min-height:26px; opacity:0; transition: opacity .8s ease;
  }
  .mystery-banner.show{ opacity:1; }

  /* COMPLETION SCREEN */
  .completion{ display:none; text-align:center; padding: 40px 0 80px; }
  .completion.visible{ display:block; }
  .completion h2{
    font-family:'Playfair Display', serif; font-style:italic; font-size: clamp(24px,4vw,34px); color: var(--gold); margin: 0 0 18px;
  }
  .completion p{
    font-family:'Cormorant Garamond', serif; font-size:18px; color: var(--ink-soft); line-height:1.7; margin: 0 0 14px;
  }
  .back-btn{
    display:inline-block; margin-top:22px; background: linear-gradient(135deg, var(--gold), #b8860b); color:#1a1120;
    text-decoration:none; font-weight:700; font-size:14px; padding: 14px 34px; border-radius:100px;
  }

  footer{ text-align:center; padding: 20px 0 50px; color: var(--ink-soft); font-size:13px; font-family:'Cormorant Garamond', serif; font-style:italic; position:relative; z-index:1; }

  .koala-fixed{
    position: fixed;
    bottom: 14px;
    right: 14px;
    width: 120px;
    z-index: 100;
    pointer-events:none;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.4));
  }

  @media (max-width: 700px){ .navlinks a{ display:none; } .navlinks a.active{ display:inline-block; } .electron{ width:46px; height:46px; margin:-23px 0 0 -23px; font-size:20px; } }
</style>
</head>

<div class="wrap">

    <p class="eyebrow">✦ Our Dreams ✦</p>
    <h1>Our future is made of little dreams</h1>
    <p class="page-sub" id="introSub">Catch a dream ✨</p>

  <div class="progress-wrap">
    <div class="progress-label">Dreams Unlocked</div>

    emoji:"🔐",
    title:"Our Secret Promise",
    quote:"Some dreams are about where we want to go. Some are about what we want to build. And some are promises we choose to make to each other. We want to wait until marriage before having sex."
  };

  // ---- STARFIELD ----
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsEl.appendChild(s);
  }

  // ---- ATOM SETUP ----
  const stage = document.getElementById('atomStage');
  const nucleus = document.getElementById('nucleus');
  const progressNum = document.getElementById('progressNum');
  const promptEl = document.getElementById('prompt');
  const mysteryBanner = document.getElementById('mysteryBanner');
  const modalOverlay = document.getElementById('modalOverlay');
  const dreamCard = document.getElementById('dreamCard');
  const completion = document.getElementById('completion');
  const introSub = document.getElementById('introSub');

  let unlockedCount = 0;
  let electrons = [];
  let secretUnlocked = false;
  let animId = null;

  function stageSize(){ return stage.clientWidth; }

  // build orbit rings (3 rings)
  const ringCount = 3;
  const ringFractions = [0.38, 0.62, 0.88]; // fraction of half-stage-size
  function buildOrbits(){
    stage.querySelectorAll('.orbit').forEach(o => o.remove());
    const size = stageSize();
    ringFractions.forEach(frac => {
      const d = size * frac;
      const ring = document.createElement('div');
      ring.className = 'orbit';
      ring.style.width = d + 'px';
      ring.style.height = d + 'px';
      stage.insertBefore(ring, nucleus);
    });
  }

  function createElectronEl(dream, isGolden){
    const el = document.createElement('div');
    el.className = 'electron' + (isGolden ? ' golden' : '');
    el.textContent = isGolden ? '✨' : '★';
    stage.appendChild(el);
    return el;
  }

  function setupElectrons(){
    electrons = [];
    const shuffled = ALL_DREAMS.map((d, i) => ({ dream: d, id: i })).sort(() => Math.random() - 0.5);
    shuffled.forEach((item, idx) => {
      const ringIndex = idx % ringCount;
      const el = createElectronEl(item.dream, false);
      const speed = (0.25 + Math.random() * 0.35) * (Math.random() < 0.5 ? 1 : -1);
      const angle = Math.random() * Math.PI * 2;
      const e = {
        el, dream: item.dream, ringIndex, speed, angle, caught: false
      };
      el.addEventListener('click', () => catchElectron(e));
      el.addEventListener('touchstart', (ev) => { ev.preventDefault(); catchElectron(e); }, { passive:false });
      electrons.push(e);
    });
  }

  function speedMultiplier(){
    // ramps up sharply as more dreams are caught — capped so it stays catchable
    const m = 1 + unlockedCount * 0.45;
    return Math.min(m, 6);
  }

  function animate(){
    const size = stageSize();
    const cx = size / 2;
    const cy = size / 2;
    const mult = speedMultiplier();
    electrons.forEach(e => {
      if (e.caught) return;
      e.angle += e.speed * 0.02 * mult;
      const radius = (size * ringFractions[e.ringIndex]) / 2;
      const x = cx + radius * Math.cos(e.angle);
      const y = cy + radius * Math.sin(e.angle) * 0.88; // slight ellipse
      e.el.style.transform = `translate(${x}px, ${y}px)`;
    });
    animId = requestAnimationFrame(animate);
  }

  function spawnParticles(x, y){
    for (let i = 0; i < 10; i++){
      const p = document.createElement('div');
      p.className = 'particle-burst';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      p.style.setProperty('--bx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--by', (Math.sin(angle) * dist) + 'px');
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      stage.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
  }

  function catchElectron(e){
    if (e.caught) return;
    e.caught = true;

    const size = stageSize();
    const cx = size / 2;
    const cy = size / 2;
    const rect = e.el.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const ex = rect.left - stageRect.left + rect.width/2;
    const ey = rect.top - stageRect.top + rect.height/2;

    spawnParticles(ex, ey);

    const dx = ex - cx;
    const dy = ey - cy;
    e.el.style.setProperty('--dx', dx + 'px');
    e.el.style.setProperty('--dy', dy + 'px');
    e.el.classList.add('caught');

    nucleus.classList.remove('pulse');
    void nucleus.offsetWidth;
    nucleus.classList.add('pulse');

    setTimeout(() => {
      e.el.remove();
      showDreamCard(e.dream, false);
    }, 480);
  }

  function showDreamCard(dream, isSecret){
    if (!isSecret){
      unlockedCount++;
      progressNum.textContent = `${unlockedCount} / ${TOTAL}`;
      progressNum.classList.remove('bump');
      void progressNum.offsetWidth;
      progressNum.classList.add('bump');
    }

    dreamCard.className = 'dream-card' + (isSecret ? ' golden' : '');
    dreamCard.innerHTML = `
      <div class="dream-unlocked-label">${isSecret ? '🔐 Secret Dream Unlocked' : 'Dream Unlocked 🔓'}</div>
      <div class="dream-emoji">${dream.emoji}</div>
      <div class="dream-title">${isSecret ? 'OUR SECRET PROMISE ❤️' : dream.title.toUpperCase()}</div>
      <p class="dream-quote">"${dream.quote}"</p>
      ${isSecret ? '' : `<div class="dream-progress">Dream unlocked: ${unlockedCount} / ${TOTAL}</div>`}
      <button class="continue-btn" id="continueBtn">${isSecret ? 'CONTINUE →' : 'CONTINUE ORBITING →'}</button>
    `;
    modalOverlay.classList.add('visible');

    document.getElementById('continueBtn').addEventListener('click', () => {
      modalOverlay.classList.remove('visible');
      if (isSecret){
        showCompletion();
      } else if (unlockedCount >= TOTAL){
        triggerSecretSequence();
      }
    });
  }

  function triggerSecretSequence(){
    promptEl.textContent = '';
    introSub.textContent = '';
    setTimeout(() => {
      mysteryBanner.textContent = "Wait... there's one more.";
      mysteryBanner.classList.add('show');
      stage.style.filter = 'brightness(0.75)';

      setTimeout(() => {
        const el = createElectronEl(SECRET_DREAM, true);
        const speed = 0.5;
        const angle = Math.random() * Math.PI * 2;
        const size = stageSize();
        const ringIndex = 1;
        const e = { el, dream: SECRET_DREAM, ringIndex, speed, angle, caught:false };
        el.addEventListener('click', () => catchSecretElectron(e));
        el.addEventListener('touchstart', (ev) => { ev.preventDefault(); catchSecretElectron(e); }, { passive:false });
        electrons.push(e);
      }, 1600);
    }, 800);
  }

  function catchSecretElectron(e){
    if (e.caught) return;
    e.caught = true;

    const rect = e.el.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const ex = rect.left - stageRect.left + rect.width/2;
    const ey = rect.top - stageRect.top + rect.height/2;
    const size = stageSize();
    const dx = ex - size/2;
    const dy = ey - size/2;
    e.el.style.setProperty('--dx', dx + 'px');
    e.el.style.setProperty('--dy', dy + 'px');

    spawnParticles(ex, ey);
    e.el.classList.add('caught');

    nucleus.classList.remove('pulse');
    void nucleus.offsetWidth;
    nucleus.classList.add('pulse');

    mysteryBanner.classList.remove('show');
    stage.style.filter = '';

    setTimeout(() => {
      e.el.remove();
      showDreamCard(SECRET_DREAM, true);
    }, 480);
  }

  function showCompletion(){
    if (animId) cancelAnimationFrame(animId);
    stage.style.display = 'none';
    promptEl.style.display = 'none';
    document.querySelector('.progress-wrap').style.display = 'none';
    completion.classList.add('visible');
    completion.innerHTML = `
      <h2>ALL OUR DREAMS UNLOCKED ✨</h2>
      <p>These aren't just dreams anymore. They're things we're going to work toward together.</p>
      <p>We've already made two years of memories.<br>Now imagine everything still waiting for us. ❤️</p>
      <a href="index.html" class="back-btn">BACK TO OUR STORY</a>
    `;
  }

  buildOrbits();
  setupElectrons();
  animate();

  window.addEventListener('resize', () => {
    buildOrbits();
  });
</script>

</body>
</html>
