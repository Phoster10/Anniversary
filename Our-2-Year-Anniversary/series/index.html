<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Watchlist — Phoster & Tracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fbe4ea;
    --blush-deep:#f6c9d6;
    --lavender:#eee3f5;
    --cream:#fff8f5;
    --rose:#c4577a;
    --rose-deep:#9c3f5e;
    --ink:#4a3541;
    --ink-soft:#8a7480;
    --white:#fffdfc;
    --shadow: 0 10px 30px rgba(156, 63, 94, 0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Karla', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, var(--blush) 0%, transparent 60%),
      radial-gradient(ellipse 800px 600px at 90% 5%, var(--lavender) 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, #fff 30%);
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  .cloud{
    position:absolute;
    background: radial-gradient(circle, rgba(246,201,214,0.9) 0%, rgba(246,201,214,0.55) 55%, rgba(246,201,214,0) 75%);
    border-radius: 50%;
    filter: blur(2px);
    z-index:0;
    pointer-events:none;
  }
  .cloud1{ width:420px; height:420px; top:-140px; left:-100px; }
  .cloud2{ width:340px; height:340px; top:60px; right:-120px; }
  .cloud3{ width:300px; height:300px; top:600px; left:-80px; }
  .cloud4{ width:360px; height:360px; top:760px; right:-140px; }
  .cloud5{ width:260px; height:260px; top:1100px; left:35%; }
  nav, .wrap{ position:relative; z-index:1; }
  .wrap{max-width:900px; margin:0 auto; padding:0 28px;}

  nav{
    background: var(--blush);
    padding: 18px 0;
    position: sticky; top:0; z-index:50;
    box-shadow: 0 2px 12px rgba(156,63,94,0.06);
  }
  .navwrap{
    max-width:1180px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--rose-deep);
    text-decoration:none;
    line-height:1.1;
  }
  .logo .sub{
    display:block;
    font-family:'Karla', sans-serif;
    font-style:normal;
    font-size:9.5px;
    letter-spacing:2px;
    color:var(--ink-soft);
  }
  .navlinks{ display:flex; align-items:center; gap:6px; }
  .navlinks a{
    text-decoration:none;
    color:var(--ink);
    font-size:14.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:100px;
  }
  .navlinks a:hover{ background: rgba(255,255,255,0.5); }
  .navlinks a.active{ background: var(--white); color:var(--rose-deep); box-shadow: var(--shadow); }
  .heart-icon{
    width:36px; height:36px;
    border-radius:50%;
    background: var(--rose);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    flex-shrink:0;
  }

  .page-header{
    text-align:center;
    padding: 50px 0 10px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--rose);
    font-size:15px;
    margin:0 0 6px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(30px, 4.5vw, 44px);
    color:var(--rose-deep);
    margin:0 0 8px;
  }
  .page-sub{ color:var(--ink-soft); font-size:15px; }

  .tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin: 24px 0 8px;
    flex-wrap:wrap;
  }
  .tab{
    border:none;
    background: var(--white);
    color: var(--ink-soft);
    font-family:'Karla', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:9px 20px;
    border-radius:100px;
    cursor:pointer;
    box-shadow: 0 2px 8px rgba(156,63,94,0.08);
  }
  .tab.active{ background: var(--rose); color:#fff; }

  .list{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding: 26px 0 70px;
  }
  .row{
    background: var(--white);
    border-radius: 18px;
    padding: 16px 20px;
    display:flex;
    align-items:center;
    gap:18px;
    box-shadow: var(--shadow);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .row:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(156,63,94,0.18);
  }
  .poster{
    width:56px; height:84px;
    border-radius:10px;
    background-size:cover;
    background-position:center top;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    color:#fff;
    overflow:hidden;
  }
  .poster img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .row-info{ flex:1; }
  .row-title{ font-weight:700; font-size:15.5px; }
  .row-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .row-stars{ font-size:12px; color:var(--rose); margin-top:4px; letter-spacing:1px; }
  .row-who{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:#fff;
    background: var(--rose-deep);
    padding:4px 10px;
    border-radius:100px;
    flex-shrink:0;
  }

  footer{
    text-align:center;
    padding: 20px 0 50px;
    color: var(--ink-soft);
    font-size:13px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
  }

  .koala-fixed{
    position: fixed;
    bottom: 14px;
    right: 14px;
    width: 130px;
    z-index: 100;
    pointer-events:none;
    filter: drop-shadow(0 8px 14px rgba(156,63,94,0.3));
  }

  @media (max-width: 880px){
    .navlinks a{ display:none; }
    .navlinks a.active{ display:inline-block; }
    .koala-fixed{ width: 90px; }
  }
</style>
</head>

  const list = document.getElementById('list');
  let currentFilter = 'all';

  function render(){
    list.innerHTML = '';
    const filtered = items.filter(i => currentFilter === 'all' || i.who.includes(currentFilter));
    filtered.forEach(item => {
      const row = document.createElement('div');
      row.className = 'row';
      const whoLabel = item.who.length > 1 ? 'Both of Us' : (item.who[0] === 'tracy' ? 'Tracy' : 'Phoster');
      row.innerHTML = `
        <div class="poster"><img src="data:image/jpeg;base64,${item.poster}" alt="${item.title}"></div>
        <div class="row-info">
          <div class="row-title">${item.title}</div>
          <div class="row-meta">${item.meta}</div>
          <div class="row-stars">${'★'.repeat(item.stars)}${'☆'.repeat(5-item.stars)}</div>
        </div>
        <div class="row-who">${whoLabel}</div>
      `;
      list.appendChild(row);
    });
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  render();
</script>
