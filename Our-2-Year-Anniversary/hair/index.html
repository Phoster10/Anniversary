<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Goals — Phoster & Tracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fbe4ea; --blush-deep:#f6c9d6; --lavender:#eee3f5; --cream:#fff8f5;
    --rose:#c4577a; --rose-deep:#9c3f5e; --ink:#4a3541; --ink-soft:#8a7480;
    --white:#fffdfc; --shadow: 0 10px 30px rgba(156, 63, 94, 0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Karla', sans-serif; color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, var(--blush) 0%, transparent 60%),
      radial-gradient(ellipse 800px 600px at 90% 5%, var(--lavender) 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, #fff 30%);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .cloud{
    position:absolute;
    background: radial-gradient(circle, rgba(246,201,214,0.9) 0%, rgba(246,201,214,0.55) 55%, rgba(246,201,214,0) 75%);
    border-radius: 50%;
    filter: blur(2px);
    z-index:0;
    pointer-events:none;
  }
  .cloud1{ width:420px; height:420px; top:-140px; left:-100px; }
  .cloud2{ width:340px; height:340px; top:60px; right:-120px; }
  .cloud3{ width:300px; height:300px; top:600px; left:-80px; }
  .cloud4{ width:360px; height:360px; top:760px; right:-140px; }
  nav, .wrap{ position:relative; z-index:1; }

  .wrap{max-width:1100px; margin:0 auto; padding:0 28px;}
  nav{ background: var(--blush); padding: 18px 0; position: sticky; top:0; z-index:50; box-shadow: 0 2px 12px rgba(156,63,94,0.06); }
  .navwrap{ max-width:1180px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600; font-size:19px; color:var(--rose-deep); text-decoration:none; line-height:1.1; }
  .logo .sub{ display:block; font-family:'Karla', sans-serif; font-style:normal; font-size:9.5px; letter-spacing:2px; color:var(--ink-soft); }
  .navlinks{ display:flex; align-items:center; gap:6px; }
  .navlinks a{ text-decoration:none; color:var(--ink); font-size:14.5px; font-weight:500; padding:9px 16px; border-radius:100px; }
  .navlinks a:hover{ background: rgba(255,255,255,0.5); }
  .navlinks a.active{ background: var(--white); color:var(--rose-deep); box-shadow: var(--shadow); }
  .heart-icon{ width:36px; height:36px; border-radius:50%; background: var(--rose); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; font-size:15px; flex-shrink:0; }
  .page-header{ text-align:center; padding: 50px 0 10px; }
  .eyebrow{ font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--rose); font-size:15px; margin:0 0 6px; }
  h1{ font-family:'Playfair Display', serif; font-style:italic; font-weight:500; font-size: clamp(30px, 4.5vw, 44px); color:var(--rose-deep); margin:0 0 8px; }
  .page-sub{ color:var(--ink-soft); font-size:15px; }

  .photo-grid{
    columns: 4 220px;
    column-gap: 18px;
    padding: 30px 0 20px;
  }
  .photo-item{
    break-inside: avoid;
    margin-bottom: 18px;
    border-radius: 18px;
    overflow:hidden;
    box-shadow: var(--shadow);
    background: var(--white);
    border: 4px solid #fff;
    cursor:pointer;
    transition: transform .3s cubic-bezier(.2,.8,.3,1.1);
  }
  .photo-item:hover{ transform: translateY(-4px); }
  .photo-item img{ display:block; width:100%; height:auto; }

  .reminder-card{
    background: var(--white);
    border-radius:22px;
    padding: 30px 28px;
    box-shadow: var(--shadow);
    margin: 20px 0 60px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .reminder-icon{ font-size:34px; flex-shrink:0; }
  .reminder-text{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:18px;
    color:var(--rose-deep);
  }

  /* LIGHTBOX */
  .lightbox{ position:fixed; inset:0; background: rgba(74,53,65,0.86); display:none; align-items:center; justify-content:center; z-index:200; padding: 30px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width: 90vw; max-height: 88vh; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .lightbox-close{ position:absolute; top:24px; right:28px; width:42px; height:42px; border-radius:50%; background: rgba(255,255,255,0.15); color:#fff; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lightbox-close:hover{ background: rgba(255,255,255,0.28); }

  footer{ text-align:center; padding: 10px 0 50px; color: var(--ink-soft); font-size:13px; font-family:'Cormorant Garamond', serif; font-style:italic; }
  @media (max-width: 880px){ .navlinks a{ display:none; } .navlinks a.active{ display:inline-block; } .photo-grid{ columns: 2 160px; } }

  .koala-fixed{
    position: fixed;
    bottom: 14px;
    right: 14px;
    width: 130px;
    z-index: 100;
    pointer-events:none;
    filter: drop-shadow(0 8px 14px rgba(156,63,94,0.3));
  }
</style>
</head>

  const grid = document.getElementById('photoGrid');
  photos.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="${src}" alt="Tracy's hairstyle ${i+1}" loading="lazy">`;
    div.addEventListener('click', () => openLightbox(src));
    grid.appendChild(div);
  });

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  function openLightbox(src){ lbImg.src = src; lightbox.classList.add('open'); }
  document.getElementById('lbClose').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });
