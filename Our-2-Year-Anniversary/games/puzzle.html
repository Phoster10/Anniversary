<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fbe4ea;
    --blush-deep:#f6c9d6;
    --lavender:#eee3f5;
    --cream:#fff8f5;
    --rose:#c4577a;
    --rose-deep:#9c3f5e;
    --ink:#4a3541;
    --ink-soft:#8a7480;
    --white:#fffdfc;
    --shadow: 0 10px 30px rgba(156, 63, 94, 0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Karla', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, var(--blush) 0%, transparent 60%),
      radial-gradient(ellipse 800px 600px at 90% 5%, var(--lavender) 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, #fff 30%);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .cloud{
    position:absolute;
    background: radial-gradient(circle, rgba(246,201,214,0.9) 0%, rgba(246,201,214,0.55) 55%, rgba(246,201,214,0) 75%);
    border-radius: 50%;
    filter: blur(2px);
    z-index:0;
    pointer-events:none;
  }
  .cloud1{ width:420px; height:420px; top:-140px; left:-100px; }
  .cloud2{ width:340px; height:340px; top:60px; right:-120px; }
  .cloud3{ width:300px; height:300px; top:520px; left:-80px; }
  nav, .wrap{ position:relative; z-index:1; }

  .wrap{max-width:900px; margin:0 auto; padding:0 28px;}

  nav{
    background: var(--blush);
    padding: 18px 0;
    position: sticky; top:0; z-index:50;
    box-shadow: 0 2px 12px rgba(156,63,94,0.06);
  }
  .navwrap{
    max-width:1180px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--rose-deep);
    text-decoration:none;
    line-height:1.1;
  }
  .logo .sub{
    display:block;
    font-family:'Karla', sans-serif;
    font-style:normal;
    font-size:9.5px;
    letter-spacing:2px;
    color:var(--ink-soft);
  }
  .navlinks{ display:flex; align-items:center; gap:6px; }
  .navlinks a{
    text-decoration:none;
    color:var(--ink);
    font-size:14.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:100px;
  }
  .navlinks a:hover{ background: rgba(255,255,255,0.5); }
  .navlinks a.active{ background: var(--white); color:var(--rose-deep); box-shadow: var(--shadow); }
  .heart-icon{
    width:36px; height:36px;
    border-radius:50%;
    background: var(--rose);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    flex-shrink:0;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--rose-deep);
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    margin: 24px 0 0;
  }

  .page-header{
    text-align:center;
    padding: 20px 0 10px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--rose);
    font-size:15px;
    margin:0 0 6px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(28px, 4.5vw, 40px);
    color:var(--rose-deep);
    margin:0 0 8px;
  }
  .page-sub{ color:var(--ink-soft); font-size:14.5px; }

  /* PHOTO PICKER */
  .picker{
    display:flex;
    justify-content:center;
    gap:20px;
    padding: 30px 0 70px;
    flex-wrap:wrap;
  }
  .picker-card{
    cursor:pointer;
    border-radius: 20px;
    overflow:hidden;
    box-shadow: var(--shadow);
    border: 4px solid #fff;
    transition: transform .25s ease, box-shadow .25s ease;
    width: 220px;
  }
  .picker-card:hover{
    transform: translateY(-6px);
    box-shadow: 0 16px 32px rgba(156,63,94,0.22);
  }
  .picker-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
  }
  .picker-label{
    text-align:center;
    padding: 12px;
    font-weight:600;
    font-size:14px;
    color:var(--rose-deep);
    background: var(--white);
  }

  /* GAME AREA */
  .game-area{
    display:none;
    flex-direction:column;
    align-items:center;
    padding: 20px 0 70px;
  }
  .game-area.visible{ display:flex; }

  .controls-row{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff;
    border:none;
    font-weight:600;
    font-size:13.5px;
    padding: 11px 22px;
    border-radius:100px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(156,63,94,0.25);
  }
  .btn.secondary{
    background: var(--white);
    color: var(--rose-deep);
    box-shadow: var(--shadow);
  }
  .btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
    box-shadow:none;
  }

  .puzzle-board{
    display:grid;
    grid-template-columns: repeat(3, 130px);
    grid-template-rows: repeat(3, 130px);
    gap: 6px;
    background: var(--white);
    padding: 10px;
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .piece{
    width:130px;
    height:130px;
    background-size: 390px 390px;
    border-radius: 10px;
    cursor:pointer;
    position:relative;
    transition: transform .15s ease, box-shadow .2s ease;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5);
  }
  .piece:hover{ transform: scale(0.97); }
  .piece.selected{
    box-shadow: 0 0 0 3px var(--rose);
    transform: scale(0.95);
  }
  .piece.correct::after{
    content:"";
    position:absolute; inset:0;
    border-radius:10px;
    box-shadow: inset 0 0 0 3px #7fc97f;
    pointer-events:none;
  }

  .status{
    margin-top: 20px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: 18px;
    color: var(--rose-deep);
    text-align:center;
    min-height: 26px;
  }

  .change-photo{
    margin-top: 16px;
    font-size:12.5px;
    color: var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
  }

  @media (max-width: 500px){
    .puzzle-board{ grid-template-columns: repeat(3, 96px); grid-template-rows: repeat(3, 96px); }
    .piece{ width:96px; height:96px; background-size: 288px 288px; }
  }
</style>
</head>

  };

  const GRID = 3; // 3x3 = 9 pieces — kept small on purpose
  const TILE = 130;

  let currentPhoto = null;
  let order = []; // order[position] = originalIndex
  let selected = null;
  let tipsLeft = 3;

  const picker = document.getElementById('picker');
  const gameArea = document.getElementById('gameArea');
  const board = document.getElementById('puzzleBoard');
  const statusEl = document.getElementById('status');
  const subText = document.getElementById('subText');
  const tipsLeftEl = document.getElementById('tipsLeft');
  const tipBtn = document.getElementById('tipBtn');

  picker.querySelectorAll('.picker-card').forEach(card => {
    card.addEventListener('click', () => startPuzzle(card.dataset.photo));
  });

  function startPuzzle(photoKey){
    currentPhoto = photoKey;
    picker.style.display = 'none';
    gameArea.classList.add('visible');
    subText.textContent = "Click two pieces to swap them — get every piece back in place.";
    tipsLeft = 3;
    tipsLeftEl.textContent = tipsLeft;
    tipBtn.disabled = false;
    shuffleOrder();
    renderBoard();
  }

  function shuffleOrder(){
    order = Array.from({length: GRID*GRID}, (_, i) => i);
    // Fisher-Yates, and guarantee it isn't already solved
    do {
      for (let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    } while (isSolved());
    selected = null;
    statusEl.textContent = "Click two pieces to swap them.";
  }

  function isSolved(){
    return order.every((val, i) => val === i);
  }

  function renderBoard(){
    board.innerHTML = '';
    order.forEach((originalIndex, pos) => {
      const row = Math.floor(originalIndex / GRID);
      const col = originalIndex % GRID;
      const piece = document.createElement('div');
      piece.className = 'piece' + (originalIndex === pos ? ' correct' : '');
      piece.style.backgroundImage = `url('${photos[currentPhoto]}')`;
      piece.style.backgroundPosition = `-${col * TILE}px -${row * TILE}px`;
      piece.dataset.pos = pos;
      piece.addEventListener('click', () => handlePieceClick(pos));
      board.appendChild(piece);
    });
  }

  function handlePieceClick(pos){
    if (selected === null){
      selected = pos;
      board.children[pos].classList.add('selected');
      return;
    }
    if (selected === pos){
      board.children[pos].classList.remove('selected');
      selected = null;
      return;
    }
    // swap
    [order[selected], order[pos]] = [order[pos], order[selected]];
    board.children[selected].classList.remove('selected');
    selected = null;
    renderBoard();

    if (isSolved()){
      statusEl.textContent = "You did it! Every piece is home. 🎉💗";
    } else {
      statusEl.textContent = "Click two pieces to swap them.";
    }
  }

  document.getElementById('reshuffleBtn').addEventListener('click', () => {
    shuffleOrder();
    renderBoard();
  });

  document.getElementById('changePhotoBtn').addEventListener('click', () => {
    gameArea.classList.remove('visible');
    picker.style.display = 'flex';
    subText.textContent = "Pick a photo to start.";
  });

  tipBtn.addEventListener('click', () => {
    if (tipsLeft <= 0) return;
    let fixed = 0;
    for (let i = 0; i < order.length && fixed < 3; i++){
      if (order[i] !== i){
        // find where piece "i" currently sits, and swap it home
        const currentPos = order.indexOf(i);
        [order[i], order[currentPos]] = [order[currentPos], order[i]];
        fixed++;
      }
    }
    tipsLeft--;
    tipsLeftEl.textContent = tipsLeft;
    if (tipsLeft <= 0) tipBtn.disabled = true;
    renderBoard();
    if (isSolved()){
      statusEl.textContent = "You did it! Every piece is home. 🎉💗";
    } else {
      statusEl.textContent = `Tip used — ${fixed} piece${fixed === 1 ? '' : 's'} placed correctly.`;
    }
  });
</script>
