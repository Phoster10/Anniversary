<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe — Phoster & Tracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fbe4ea;
    --blush-deep:#f6c9d6;
    --lavender:#eee3f5;
    --cream:#fff8f5;
    --rose:#c4577a;
    --rose-deep:#9c3f5e;
    --ink:#4a3541;
    --ink-soft:#8a7480;
    --white:#fffdfc;
    --shadow: 0 10px 30px rgba(156, 63, 94, 0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Karla', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, var(--blush) 0%, transparent 60%),
      radial-gradient(ellipse 800px 600px at 90% 5%, var(--lavender) 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, #fff 30%);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .cloud{
    position:absolute;
    background: radial-gradient(circle, rgba(246,201,214,0.9) 0%, rgba(246,201,214,0.55) 55%, rgba(246,201,214,0) 75%);
    border-radius: 50%;
    filter: blur(2px);
    z-index:0;
    pointer-events:none;
  }
  .cloud1{ width:420px; height:420px; top:-140px; left:-100px; }
  .cloud2{ width:340px; height:340px; top:60px; right:-120px; }
  .cloud3{ width:300px; height:300px; top:420px; left:-80px; }
  .cloud4{ width:380px; height:380px; top:520px; right:-140px; }
  .cloud5{ width:260px; height:260px; top:900px; left:40%; }
  nav, .wrap{ position:relative; z-index:1; }
  .wrap{max-width:900px; margin:0 auto; padding:0 28px;}

  nav{
    background: var(--blush);
    padding: 18px 0;
    position: sticky; top:0; z-index:50;
    box-shadow: 0 2px 12px rgba(156,63,94,0.06);
  }
  .navwrap{
    max-width:1180px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--rose-deep);
    text-decoration:none;
    line-height:1.1;
  }
  .logo .sub{
    display:block;
    font-family:'Karla', sans-serif;
    font-style:normal;
    font-size:9.5px;
    letter-spacing:2px;
    color:var(--ink-soft);
  }
  .navlinks{ display:flex; align-items:center; gap:6px; }
  .navlinks a{
    text-decoration:none;
    color:var(--ink);
    font-size:14.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:100px;
  }
  .navlinks a:hover{ background: rgba(255,255,255,0.5); }
  .navlinks a.active{ background: var(--white); color:var(--rose-deep); box-shadow: var(--shadow); }
  .heart-icon{
    width:36px; height:36px;
    border-radius:50%;
    background: var(--rose);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    flex-shrink:0;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--rose-deep);
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    margin: 24px 0 0;
  }

  .page-header{
    text-align:center;
    padding: 20px 0 10px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--rose);
    font-size:15px;
    margin:0 0 6px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(28px, 4.5vw, 40px);
    color:var(--rose-deep);
    margin:0 0 8px;
  }
  .page-sub{ color:var(--ink-soft); font-size:14.5px; }

  .game-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 0 70px;
  }

  .mode-toggle{
    display:flex;
    gap:10px;
    margin-bottom: 22px;
  }
  .mode-btn{
    border:none;
    background: var(--white);
    color: var(--ink-soft);
    font-family:'Karla', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:10px 22px;
    border-radius:100px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: all .2s ease;
  }
  .mode-btn.active{
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff;
  }
  .scoreboard{
    display:flex;
    gap:14px;
    margin-bottom: 26px;
  }
  .score-card{
    background: var(--white);
    border-radius:16px;
    padding: 12px 22px;
    text-align:center;
    box-shadow: var(--shadow);
    min-width: 100px;
  }
  .score-card.active{ box-shadow: 0 0 0 3px var(--rose), var(--shadow); }
  .score-card .who{ font-size:12px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:6px; justify-content:center; }
  .score-card .who img{ width:22px; height:22px; border-radius:50%; object-fit:cover; }
  .score-card .val{ font-family:'Playfair Display', serif; font-size:26px; color:var(--rose-deep); font-weight:600; }

  .board{
    display:grid;
    grid-template-columns: repeat(3, 96px);
    grid-template-rows: repeat(3, 96px);
    gap: 10px;
    background: var(--white);
    padding: 14px;
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .cell{
    background: var(--blush);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
    font-family:'Playfair Display', serif;
    cursor:pointer;
    color: var(--rose-deep);
    transition: background .2s ease, transform .15s ease;
    user-select:none;
    overflow:hidden;
  }
  .cell img{
    width: 82%;
    height: 82%;
    object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(156,63,94,0.25);
  }
  .cell:hover{ background: var(--blush-deep); }
  .cell.taken{ cursor:default; }
  .cell.win{ background: var(--rose); }
  .cell.win img{ box-shadow: 0 0 0 3px #fff, 0 4px 10px rgba(156,63,94,0.4); }

  .status{
    margin-top: 22px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: 19px;
    color: var(--rose-deep);
    text-align:center;
    min-height: 28px;
  }

  .controls{
    margin-top: 18px;
    display:flex;
    gap:12px;
  }
  .btn{
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff;
    border:none;
    font-weight:600;
    font-size:13.5px;
    padding: 11px 26px;
    border-radius:100px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(156,63,94,0.25);
  }
  .btn.secondary{
    background: var(--white);
    color: var(--rose-deep);
    box-shadow: var(--shadow);
  }

  @media (max-width: 500px){
    .board{ grid-template-columns: repeat(3, 78px); grid-template-rows: repeat(3, 78px); }
    .cell{ font-size:36px; }
  }
</style>
</head>

  const winLines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const modePvpBtn = document.getElementById('modePvp');
  const modeCpuBtn = document.getElementById('modeCpu');

  modePvpBtn.addEventListener('click', () => {
    if (mode === 'pvp') return;
    mode = 'pvp';
    modePvpBtn.classList.add('active');
    modeCpuBtn.classList.remove('active');
    resetBoard();
  });
  modeCpuBtn.addEventListener('click', () => {
    if (mode === 'cpu') return;
    mode = 'cpu';
    modeCpuBtn.classList.add('active');
    modePvpBtn.classList.remove('active');
    resetBoard();
  });

  function renderBoard(){
    boardEl.innerHTML = '';
    cells.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ' taken' : '');
      cell.innerHTML = val ? `<img src="${AVATARS[val]}" alt="${val}">` : '';
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
    });
  }

  function handleMove(i){
    if (gameOver || cells[i]) return;
    if (mode === 'cpu' && current === 'tracy') return;
    placeMove(i, current);
  }

  function placeMove(i, player){
    cells[i] = player;
    renderBoard();

    const win = checkWin(cells);
    if (win){
      highlightWin(win);
      gameOver = true;
      scores[player]++;
      updateScores();
      statusEl.textContent = (player === 'phoster' ? 'Phoster' : 'Tracy') + ' wins this round! 🎉';
      return;
    }
    if (cells.every(c => c)){
      gameOver = true;
      statusEl.textContent = "It's a tie! 🤝";
      return;
    }
    current = current === 'phoster' ? 'tracy' : 'phoster';
    updateTurnUI();

    if (mode === 'cpu' && current === 'tracy' && !gameOver){
      statusEl.textContent = "Tracy is thinking…";
      setTimeout(cpuMove, 550);
    }
  }

  function cpuMove(){
    if (gameOver) return;
    const i = bestMoveFor('tracy');
    if (i !== -1) placeMove(i, 'tracy');
  }

  function checkWin(board){
    for (const line of winLines){
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return line;
    }
    return null;
  }

  function bestMoveFor(player){
    const opponent = player === 'tracy' ? 'phoster' : 'tracy';

    // beatable CPU: sometimes plays a random legal move instead of the optimal one
    const empties = [];
    for (let i = 0; i < 9; i++) if (!cells[i]) empties.push(i);

    const mistakeChance = 0.35; // ~35% chance of a suboptimal move
    if (Math.random() < mistakeChance){
      return empties[Math.floor(Math.random() * empties.length)];
    }

    let bestScore = -Infinity;
    let move = -1;
    for (let i = 0; i < 9; i++){
      if (!cells[i]){
        cells[i] = player;
        const score = minimax(cells, 0, false, player, opponent);
        cells[i] = null;
        if (score > bestScore){
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }

  function minimax(board, depth, isMaximizing, player, opponent){
    const win = checkWin(board);
    if (win){
      const winner = board[win[0]];
      if (winner === player) return 10 - depth;
      if (winner === opponent) return depth - 10;
    }
    if (board.every(c => c)) return 0;

    if (isMaximizing){
      let best = -Infinity;
      for (let i = 0; i < 9; i++){
        if (!board[i]){
          board[i] = player;
          best = Math.max(best, minimax(board, depth + 1, false, player, opponent));
          board[i] = null;
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++){
        if (!board[i]){
          board[i] = opponent;
          best = Math.min(best, minimax(board, depth + 1, true, player, opponent));
          board[i] = null;
        }
      }
      return best;
    }
  }

  function highlightWin(line){
    const cellEls = boardEl.children;
    line.forEach(i => cellEls[i].classList.add('win'));
  }

  function updateTurnUI(){
    if (mode === 'cpu' && current === 'tracy'){
      statusEl.textContent = "Tracy is thinking…";
    } else {
      statusEl.textContent = (current === 'phoster' ? "Phoster's turn" : "Tracy's turn");
    }
    scorePCard.classList.toggle('active', current === 'phoster');
    scoreTCard.classList.toggle('active', current === 'tracy');
  }

  function updateScores(){
    scorePhosterEl.textContent = scores.phoster;
    scoreTracyEl.textContent = scores.tracy;
  }

  function resetBoard(){
    cells = Array(9).fill(null);
    gameOver = false;
    current = 'phoster';
    renderBoard();
    updateTurnUI();
  }

  document.getElementById('resetBtn').addEventListener('click', resetBoard);
  document.getElementById('resetScoreBtn').addEventListener('click', () => {
    scores = { phoster: 0, tracy: 0 };
    updateScores();
    resetBoard();
  });


  renderBoard();
  updateTurnUI();
</script>

</html>
